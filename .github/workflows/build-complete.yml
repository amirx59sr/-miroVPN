name: Build Complete APK with sing-box

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # ===== مرحله ۱: ساخت sing-box =====
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Clone sing-box
      run: git clone https://github.com/SagerNet/sing-box.git sing-box-src

    - name: Build sing-box for Android arm64
      run: |
        cd sing-box-src
        CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -v -tags "with_clash_api with_wireguard with_grpc with_utls with_reality_server with_quic with_dhcp with_shadowsocksr" -o ../app/src/main/assets/sing-box-arm64 ./cmd/sing-box

    - name: Build sing-box for Android armv7
      run: |
        cd sing-box-src
        CGO_ENABLED=0 GOOS=android GOARCH=arm GOARM=7 go build -v -tags "with_clash_api with_wireguard with_grpc with_utls with_reality_server with_quic with_dhcp with_shadowsocksr" -o ../app/src/main/assets/sing-box-armv7 ./cmd/sing-box

    - name: Build sing-box for Android x86_64
      run: |
        cd sing-box-src
        CGO_ENABLED=0 GOOS=android GOARCH=amd64 go build -v -tags "with_clash_api with_wireguard with_grpc with_utls with_reality_server with_quic with_dhcp with_shadowsocksr" -o ../app/src/main/assets/sing-box-x86_64 ./cmd/sing-box

    # ===== مرحله ۲: ساخت APK =====
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AmiroVPN-Complete
        path: app/build/outputs/apk/debug/app-debug.apk