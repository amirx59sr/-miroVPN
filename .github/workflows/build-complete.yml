name: Build Complete APK with sing-box

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # ===== مرحله ۱: دانلود sing-box آماده =====
    - name: Create assets directory
      run: mkdir -p app/src/main/assets

    - name: Download sing-box for arm64
      run: |
        curl -L -o sing-box-arm64.tar.gz https://github.com/SagerNet/sing-box/releases/latest/download/sing-box-linux-arm64.tar.gz
        tar -xzf sing-box-arm64.tar.gz
        cp sing-box*/sing-box app/src/main/assets/sing-box-arm64
        chmod +x app/src/main/assets/sing-box-arm64

    - name: Download sing-box for armv7
      run: |
        curl -L -o sing-box-armv7.tar.gz https://github.com/SagerNet/sing-box/releases/latest/download/sing-box-linux-armv7.tar.gz
        tar -xzf sing-box-armv7.tar.gz
        cp sing-box*/sing-box app/src/main/assets/sing-box-armv7
        chmod +x app/src/main/assets/sing-box-armv7

    - name: Download sing-box for x86_64
      run: |
        curl -L -o sing-box-x86_64.tar.gz https://github.com/SagerNet/sing-box/releases/latest/download/sing-box-linux-amd64.tar.gz
        tar -xzf sing-box-x86_64.tar.gz
        cp sing-box*/sing-box app/src/main/assets/sing-box-x86_64
        chmod +x app/src/main/assets/sing-box-x86_64

    # ===== مرحله ۲: ساخت APK =====
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AmiroVPN-Complete
        path: app/build/outputs/apk/debug/app-debug.apk